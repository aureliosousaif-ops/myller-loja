{% extends "base.html" %}

{% block titulo %}{{ pagina.titulo }} — {{ loja.nome_loja }}{% endblock %}

{% block conteudo %}
<div class="pagina-conteudo">
  <nav class="caminho">
    <a href="{% url 'core:home' %}">Início</a>
    <i class="bi bi-chevron-right mx-1"></i> {{ pagina.titulo }}
  </nav>

  <h1 class="mt-3">{{ pagina.titulo }}</h1>
  <div class="conteudo">{{ pagina.conteudo|linebreaksbr }}</div>

  <div class="mt-4">
    <a href="{% url 'core:home' %}" class="btn-outline-myller btn btn-pequeno">
      <i class="bi bi-arrow-left"></i> Voltar ao início
    </a>
  </div>
</div>
{% endblock %}
