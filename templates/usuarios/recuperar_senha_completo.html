{% extends "base.html" %}
{% load static %}

{% block titulo %}Senha redefinida — {{ loja.nome_loja }}{% endblock %}

{% block conteudo %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <div class="auth-logo">
      {% if loja.logo %}<img src="{{ loja.logo.url }}" alt="{{ loja.nome_loja }}">
      {% else %}<img src="{% static 'img/logo-myller.png' %}" alt="{{ loja.nome_loja }}">{% endif %}
    </div>

    <div class="confirmacao-icone" style="width:74px;height:74px;font-size:1.9rem">
      <i class="bi bi-shield-check"></i>
    </div>

    <h1 style="font-size:1.2rem">Senha redefinida!</h1>
    <p class="subtitulo mb-0">Sua nova senha já está ativa. Pode entrar na sua conta.</p>

    <div class="auth-rodape">
      <a href="{% url 'usuarios:login' %}" class="btn-myller">Ir para o login</a>
    </div>
  </div>
</div>
{% endblock %}
